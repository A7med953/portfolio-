<section id="experience" class="py-5 text-center text-white ">
  <div class="container">
    <h2 class="fw-bold mb-3">Experience</h2>
    <div class="line mx-auto mb-5"></div>

    <div class="row g-4">
      <div class="col-12" *ngFor="let exp of experiences">
        <div class="card  border-0 shadow p-4 text-start">
          <div class="d-flex flex-column flex-md-row justify-content-between mb-3">
            <div>
              <h4 class="fw-semibold text-primary mb-1">
                <i class="fa-solid fa-briefcase me-2"></i>{{ exp.title }}
              </h4>
              <p class="mb-0 fs-5 text-white">{{ exp.company }}</p>
            </div>
            <div class="text-white mt-2 mt-md-0">
              <i class="fa-regular fa-calendar me-2"></i>{{ exp.period }}
            </div>
          </div>

          <p class="mb-3 text-white">{{ exp.description }}</p>

          <div class="d-flex flex-wrap gap-2">
            <span
              *ngFor="let tech of exp.technologies"
              class="badge bg-primary-subtle text-primary border border-primary"
            >
              {{ tech }}
            </span>
          </div>
        </div>
      </div>
    </div>
  </div>
</section>
