<section id="projects" class="py-5 bg-dark text-white">
  <div class="container text-center">
    <h2 class="section-title fw-bold mb-5 position-relative d-inline-block">Featured Projects</h2>

    <div class="row g-4">
      <div class="col-md-6 col-lg-4" *ngFor="let project of projects | slice:0:projectsToShow">
        <div class="card h-100 border-0 shadow-sm hover-shadow">
          <img
            [src]="project.image"
            [alt]="project.title"
            class="card-img-top"
            style="height: 200px; object-fit: cover;"
          />
          <div class="card-body text-start">
            <h5 class="card-title text-white">{{ project.title }}</h5>
            <p class="text-light small">{{ project.description }}</p>

            <div class="mb-3">
              <span
                *ngFor="let tech of project.technologies"
                class="badge bg-dark border text-light me-1 mb-1"
              >
                {{ tech }}
              </span>
            </div>

            <div class="d-flex gap-2">
              <a [href]="project.liveUrl" target="_blank" class="btn btn-outline-light btn-sm w-50">
                <i class="bi bi-box-arrow-up-right me-1"></i> Live
              </a>
              <a [href]="project.githubUrl" target="_blank" class="btn btn-outline-light btn-sm w-50">
                <i class="bi bi-github me-1"></i> Code
              </a>
            </div>
          </div>
        </div>
      </div>
    </div>
    <div class="mt-5">
<div class="mt-5 d-flex justify-content-center gap-3">

  <!-- View More -->
  <button
    class="btn btn-primary px-4 py-2 fw-semibold rounded-pill"
    (click)="showMoreProjects()"
    *ngIf="projectsToShow < projects.length"
  >
    View More <i class="bi bi-arrow-right ms-2"></i>
  </button>

  <!-- View Less -->
  <button
    class="btn btn-outline-light px-4 py-2 fw-semibold rounded-pill"
    (click)="showLessProjects()"
    *ngIf="projectsToShow > 3"
  >
    <i class="bi bi-arrow-left me-2"></i> View Less
  </button>

</div>
    </div>
  </div>
</section>
